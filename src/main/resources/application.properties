# ──────────────────────────────────────────────────────────────────────────────
# BusinessOPS Analytics Dashboard – application configuration
#
# DO NOT add secrets, passwords, or credential paths to this file.
# Use environment variables or a gitignored local override instead.
# ──────────────────────────────────────────────────────────────────────────────

# Application metadata
spring.application.name=BusinessOPS Analytics Dashboard

# Server port (override with -Dserver.port=XXXX or SERVER_PORT env var)
server.port=8080

# ── Context path ────────────────────────────────────────────────────────────
# All REST endpoints are already under /api/...
# No additional servlet context path required.

# ── Actuator ─────────────────────────────────────────────────────────────────
# Expose only the info endpoint publicly; health is our custom /api/health.
management.endpoints.web.exposure.include=info
management.endpoint.health.show-details=never

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.businessops=DEBUG

# ── Firebase ─────────────────────────────────────────────────────────────────
# Set this to the absolute path of your service-account JSON, or leave blank
# to use GOOGLE_APPLICATION_CREDENTIALS / Application Default Credentials.
# NEVER commit a real path that contains credentials.
firebase.service-account-path=
