# ──────────────────────────────────────────────────────────────────────────────
# Test profile – overrides that apply when running the Maven test suite.
#
# These properties make the Spring context load cleanly in CI / local dev
# without real Firebase credentials.
# ──────────────────────────────────────────────────────────────────────────────

# Lower log noise during tests
logging.level.root=WARN
logging.level.com.businessops=DEBUG
logging.level.org.springframework.security=WARN
